<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <!-- Airy bright cool-white with whisper of cobalt & warm sunlight -->
    <linearGradient id="base-bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#edf4ff" />
      <stop offset="40%" stop-color="#f6f9ff" />
      <stop offset="72%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff8f0" />
    </linearGradient>

    <!-- Top-left Deep Navy to Royal Cobalt ring (matching G arc) -->
    <linearGradient id="tl-ring" x1="0" y1="0" x2="290" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071a38" />
      <stop offset="55%" stop-color="#0d57b8" />
      <stop offset="100%" stop-color="#2b7be9" />
    </linearGradient>

    <!-- Subtle warm orange swoosh accent peeking top-left -->
    <linearGradient id="tl-orange" x1="20" y1="180" x2="260" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f57c00" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0.2" />
    </linearGradient>

    <!-- Left large translucent cobalt-ice circle -->
    <linearGradient id="left-circle-1" x1="120" y1="320" x2="760" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c6ddf9" stop-opacity="0.65" />
      <stop offset="65%" stop-color="#e0edff" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#f5f9ff" stop-opacity="0" />
    </linearGradient>

    <!-- Left secondary overlapping warm-amber tinted halo -->
    <linearGradient id="left-circle-2" x1="560" y1="500" x2="980" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe5c4" stop-opacity="0.48" />
      <stop offset="65%" stop-color="#fff1df" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Top-right glass sphere (Cobalt Ice) -->
    <radialGradient id="tr-glass" cx="35%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#f5f9ff" stop-opacity="0.92" />
      <stop offset="54%" stop-color="#d4e5fb" stop-opacity="0.85" />
      <stop offset="88%" stop-color="#a8ccf6" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#7eb3f2" stop-opacity="0.8" />
    </radialGradient>

    <!-- Top-right vivid Brand Orange-Gold crescent orb (matching Digital swoosh) -->
    <linearGradient id="tr-orb" x1="1810" y1="30" x2="1950" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f57c00" />
      <stop offset="52%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#ffd599" stop-opacity="0.55" />
    </linearGradient>

    <!-- Seamless dissolved bottom wash (zero hard horizontal line) -->
    <linearGradient id="floor-dissolve" x1="960" y1="700" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7faff" stop-opacity="0" />
      <stop offset="55%" stop-color="#f6f9ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f8fbff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Bottom-right cobalt + orange curved corner accent -->
    <linearGradient id="br-curve" x1="1700" y1="1080" x2="1920" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d57b8" />
      <stop offset="62%" stop-color="#196fe0" />
      <stop offset="100%" stop-color="#f57c00" />
    </linearGradient>

    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" />
    </filter>

    <pattern id="dot-grid" x="66" y="236" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.8" fill="#0d57b8" opacity="0.24" />
    </pattern>
  </defs>

  <!-- Base smooth gradient -->
  <rect width="1920" height="1080" fill="url(#base-bg)" />

  <!-- Ambient soft glows -->
  <circle cx="150" cy="140" r="340" fill="#d4e6ff" opacity="0.4" filter="url(#soft-blur)" />
  <circle cx="1640" cy="140" r="360" fill="#ffe7c7" opacity="0.32" filter="url(#soft-blur)" />

  <!-- Top-left Navy-to-Cobalt arc ring -->
  <circle cx="6" cy="0" r="236" stroke="url(#tl-ring)" stroke-width="52" fill="none" />
  <path d="M-20 198 C80 182, 168 128, 232 48" stroke="url(#tl-orange)" stroke-width="10" stroke-linecap="round" fill="none" />

  <!-- Dot matrix -->
  <rect x="66" y="236" width="134" height="162" fill="url(#dot-grid)" />

  <!-- Left layered translucent circles (Cobalt + soft warm amber) -->
  <circle cx="430" cy="685" r="385" fill="url(#left-circle-1)" />
  <circle cx="775" cy="730" r="230" fill="url(#left-circle-2)" />

  <!-- Top-right layered translucent glass orbs (Cobalt + Brand Orange) -->
  <circle cx="1575" cy="90" r="235" fill="#d5e6fc" opacity="0.52" />
  <circle cx="1715" cy="135" r="255" fill="url(#tr-glass)" />
  <circle cx="1945" cy="190" r="205" fill="url(#tr-orb)" />

  <!-- Seamless dissolved bottom wash -->
  <rect x="0" y="700" width="1920" height="380" fill="url(#floor-dissolve)" />

  <!-- Bottom-right curved rim & cobalt-orange accent -->
  <path d="M1610 1080 C1700 1005, 1815 955, 1920 940 L1920 1080 Z" fill="#e6f0ff" opacity="0.82" />
  <path d="M1705 1080 C1775 1028, 1850 998, 1920 982 L1920 1080 Z" fill="url(#br-curve)" />
</svg>
