<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <!-- Base airy light blue-white ambient gradient -->
    <linearGradient id="base-bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e9f1ff" />
      <stop offset="38%" stop-color="#f3f7ff" />
      <stop offset="72%" stop-color="#f7faff" />
      <stop offset="100%" stop-color="#eef4ff" />
    </linearGradient>

    <!-- Top-left vibrant blue ring gradient -->
    <linearGradient id="tl-ring" x1="0" y1="0" x2="290" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#75a3ff" />
      <stop offset="55%" stop-color="#5386f7" />
      <stop offset="100%" stop-color="#4172ef" />
    </linearGradient>

    <!-- Left large translucent circle -->
    <linearGradient id="left-circle-1" x1="120" y1="320" x2="760" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cadcff" stop-opacity="0.72" />
      <stop offset="65%" stop-color="#ddeaff" stop-opacity="0.46" />
      <stop offset="100%" stop-color="#edf4ff" stop-opacity="0" />
    </linearGradient>

    <!-- Left secondary overlapping circle -->
    <linearGradient id="left-circle-2" x1="560" y1="500" x2="980" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c3d8ff" stop-opacity="0.62" />
      <stop offset="68%" stop-color="#dce9ff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#eef4ff" stop-opacity="0" />
    </linearGradient>

    <!-- Top-right glass sphere -->
    <radialGradient id="tr-glass" cx="35%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#f5f9ff" stop-opacity="0.92" />
      <stop offset="52%" stop-color="#d6e6ff" stop-opacity="0.88" />
      <stop offset="86%" stop-color="#b4d0ff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#96beff" stop-opacity="0.85" />
    </radialGradient>

    <!-- Top-right vivid royal-indigo orb -->
    <linearGradient id="tr-orb" x1="1810" y1="30" x2="1950" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a67f5" />
      <stop offset="52%" stop-color="#6188fc" />
      <stop offset="100%" stop-color="#b2c8ff" stop-opacity="0.65" />
    </linearGradient>

    <!-- Seamless dissolved bottom ambient glow (zero hard line!) -->
    <linearGradient id="floor-dissolve" x1="960" y1="700" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4f8ff" stop-opacity="0" />
      <stop offset="55%" stop-color="#f3f7ff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#f6f9ff" stop-opacity="0.92" />
    </linearGradient>

    <!-- Bottom-right blue curved corner accent -->
    <linearGradient id="br-curve" x1="1700" y1="1080" x2="1920" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9bb9ff" />
      <stop offset="55%" stop-color="#6490fa" />
      <stop offset="100%" stop-color="#4875f2" />
    </linearGradient>

    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" />
    </filter>

    <pattern id="dot-grid" x="66" y="236" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.8" fill="#8fb0f5" opacity="0.45" />
    </pattern>
  </defs>

  <!-- Base smooth studio gradient -->
  <rect width="1920" height="1080" fill="url(#base-bg)" />

  <!-- Subtle soft ambient glow top-left & center-right -->
  <circle cx="150" cy="140" r="340" fill="#d9e7ff" opacity="0.45" filter="url(#soft-blur)" />
  <circle cx="1640" cy="140" r="360" fill="#dce9ff" opacity="0.55" filter="url(#soft-blur)" />

  <!-- Top-left crisp blue arc ring -->
  <circle cx="6" cy="0" r="236" stroke="url(#tl-ring)" stroke-width="56" fill="none" />

  <!-- Subtle 5x6 dot matrix below top-left ring -->
  <rect x="66" y="236" width="134" height="162" fill="url(#dot-grid)" />

  <!-- Left layered translucent circles -->
  <circle cx="430" cy="685" r="385" fill="url(#left-circle-1)" />
  <circle cx="775" cy="730" r="230" fill="url(#left-circle-2)" />

  <!-- Top-right layered translucent glass orbs -->
  <circle cx="1575" cy="90" r="235" fill="#d6e5ff" opacity="0.52" />
  <circle cx="1715" cy="135" r="255" fill="url(#tr-glass)" />
  <circle cx="1945" cy="190" r="205" fill="url(#tr-orb)" />

  <!-- Seamless dissolved lower wash — NO visible horizontal line -->
  <rect x="0" y="700" width="1920" height="380" fill="url(#floor-dissolve)" />

  <!-- Bottom-right curved glass rim & royal-blue accent -->
  <path d="M1610 1080 C1700 1005, 1815 955, 1920 940 L1920 1080 Z" fill="#e6efff" opacity="0.85" />
  <path d="M1705 1080 C1775 1028, 1850 998, 1920 982 L1920 1080 Z" fill="url(#br-curve)" />
</svg>
