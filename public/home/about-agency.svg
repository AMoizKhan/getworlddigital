<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none">
  <defs>
    <linearGradient id="bg-about" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8faff" />
      <stop offset="55%" stop-color="#eef4ff" />
      <stop offset="100%" stop-color="#e2ecff" />
    </linearGradient>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6bff" />
      <stop offset="100%" stop-color="#1f4fe0" />
    </linearGradient>
    <linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f5bff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#1f5bff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0b1533" flood-opacity="0.08" />
    </filter>
    <filter id="mini-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1f4fe0" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Soft Canvas -->
  <rect width="800" height="560" rx="28" fill="url(#bg-about)" />

  <!-- Subtle Geometric Diagonal Accent -->
  <path d="M510 0L800 0L800 320L390 0Z" fill="#dbe7ff" opacity="0.55" />
  <circle cx="120" cy="460" r="150" fill="#d8e6ff" opacity="0.45" />
  <circle cx="670" cy="120" r="95" fill="#c7dbff" opacity="0.35" />

  <!-- Subtle Dot Pattern -->
  <g fill="#1f4fe0" opacity="0.16">
    <circle cx="72" cy="76" r="3" /><circle cx="96" cy="76" r="3" /><circle cx="120" cy="76" r="3" /><circle cx="144" cy="76" r="3" />
    <circle cx="72" cy="100" r="3" /><circle cx="96" cy="100" r="3" /><circle cx="120" cy="100" r="3" /><circle cx="144" cy="100" r="3" />
    <circle cx="72" cy="124" r="3" /><circle cx="96" cy="124" r="3" /><circle cx="120" cy="124" r="3" /><circle cx="144" cy="124" r="3" />
  </g>

  <!-- Main Workspace Browser Window -->
  <g filter="url(#card-shadow)">
    <rect x="92" y="88" width="560" height="370" rx="20" fill="#ffffff" stroke="#dbe5f8" stroke-width="1.5" />
    <!-- Top Chrome -->
    <path d="M92 108C92 96.9543 100.954 88 112 88H632C643.046 88 652 96.9543 652 108V134H92V108Z" fill="#f8faff" />
    <line x1="92" y1="134" x2="652" y2="134" stroke="#e6eefb" stroke-width="1.5" />
    <circle cx="120" cy="111" r="5" fill="#cbd5e1" />
    <circle cx="138" cy="111" r="5" fill="#cbd5e1" />
    <circle cx="156" cy="111" r="5" fill="#cbd5e1" />
    <rect x="210" y="101" width="240" height="20" rx="10" fill="#eef3ff" />
    <rect x="230" y="108" width="120" height="6" rx="3" fill="#9db8f8" />
    <!-- Brand pill right -->
    <rect x="548" y="100" width="82" height="22" rx="11" fill="url(#brand-grad)" />
    <rect x="564" y="109" width="50" height="4" rx="2" fill="#ffffff" opacity="0.9" />

    <!-- Left Sidebar -->
    <rect x="114" y="156" width="126" height="278" rx="14" fill="#f7f9ff" stroke="#e9effc" stroke-width="1" />
    <rect x="128" y="172" width="98" height="32" rx="10" fill="#e6eeff" />
    <circle cx="144" cy="188" r="6" fill="#1f4fe0" />
    <rect x="158" y="185" width="54" height="6" rx="3" fill="#1f4fe0" />

    <circle cx="144" cy="226" r="5" fill="#94a3b8" />
    <rect x="158" y="223" width="60" height="6" rx="3" fill="#cbd5e1" />
    <circle cx="144" cy="258" r="5" fill="#94a3b8" />
    <rect x="158" y="255" width="48" height="6" rx="3" fill="#cbd5e1" />
    <circle cx="144" cy="290" r="5" fill="#94a3b8" />
    <rect x="158" y="287" width="62" height="6" rx="3" fill="#cbd5e1" />

    <!-- Team Avatars Cluster in Sidebar -->
    <rect x="128" y="346" width="98" height="72" rx="12" fill="#ffffff" stroke="#e5ecfa" stroke-width="1" />
    <rect x="140" y="358" width="54" height="5" rx="2.5" fill="#64748b" opacity="0.5" />
    <circle cx="150" cy="390" r="13" fill="#1f4fe0" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="170" cy="390" r="13" fill="#3b82f6" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="190" cy="390" r="13" fill="#60a5fa" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="208" cy="390" r="11" fill="#e6eeff" stroke="#ffffff" stroke-width="2" />
    <text x="208" y="394" text-anchor="middle" fill="#1f4fe0" font-family="system-ui, sans-serif" font-size="9" font-weight="700">+8</text>

    <!-- Main Content Area: Top Metrics -->
    <rect x="258" y="156" width="114" height="66" rx="14" fill="#f8faff" stroke="#e4ecfb" stroke-width="1" />
    <rect x="272" y="170" width="46" height="5" rx="2.5" fill="#94a3b8" />
    <text x="272" y="205" fill="#0b1533" font-family="system-ui, sans-serif" font-size="20" font-weight="700">98.6%</text>

    <rect x="386" y="156" width="114" height="66" rx="14" fill="#f8faff" stroke="#e4ecfb" stroke-width="1" />
    <rect x="400" y="170" width="52" height="5" rx="2.5" fill="#94a3b8" />
    <text x="400" y="205" fill="#1f4fe0" font-family="system-ui, sans-serif" font-size="20" font-weight="700">250+</text>

    <rect x="514" y="156" width="116" height="66" rx="14" fill="url(#brand-grad)" />
    <rect x="528" y="170" width="50" height="5" rx="2.5" fill="#ffffff" opacity="0.7" />
    <text x="528" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">3.4x</text>

    <!-- Growth Area Chart Card -->
    <rect x="258" y="238" width="372" height="196" rx="16" fill="#ffffff" stroke="#e4ecfb" stroke-width="1.2" />
    <rect x="278" y="256" width="96" height="8" rx="4" fill="#0b1533" opacity="0.85" />
    <rect x="278" y="272" width="144" height="5" rx="2.5" fill="#94a3b8" opacity="0.6" />

    <!-- Grid lines -->
    <line x1="278" y1="310" x2="610" y2="310" stroke="#f1f5f9" stroke-width="1" />
    <line x1="278" y1="348" x2="610" y2="348" stroke="#f1f5f9" stroke-width="1" />
    <line x1="278" y1="386" x2="610" y2="386" stroke="#f1f5f9" stroke-width="1" />

    <!-- Area Path -->
    <path d="M278 394 C320 388, 344 352, 386 356 C428 360, 456 324, 498 320 C540 316, 568 292, 610 278 L610 412 L278 412 Z" fill="url(#chart-fill)" />
    <path d="M278 394 C320 388, 344 352, 386 356 C428 360, 456 324, 498 320 C540 316, 568 292, 610 278" stroke="#1f5bff" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Data Nodes -->
    <circle cx="386" cy="356" r="5" fill="#ffffff" stroke="#1f5bff" stroke-width="3" />
    <circle cx="498" cy="320" r="5" fill="#ffffff" stroke="#1f5bff" stroke-width="3" />
    <circle cx="610" cy="278" r="6" fill="#1f5bff" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Floating Card Top-Right: Sprint Delivery -->
  <g filter="url(#mini-shadow)">
    <rect x="530" y="34" width="224" height="82" rx="18" fill="#ffffff" stroke="#dce7fb" stroke-width="1.5" />
    <rect x="548" y="52" width="44" height="44" rx="12" fill="#e6eeff" />
    <path d="M562 74L568 80L580 67" stroke="#1f4fe0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="606" y="70" fill="#0b1533" font-family="system-ui, sans-serif" font-size="14" font-weight="700">On-Time Delivery</text>
    <text x="606" y="90" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Agile sprints &amp; QA</text>
  </g>

  <!-- Floating Card Bottom-Left: Full-Stack Craft -->
  <g filter="url(#mini-shadow)">
    <rect x="40" y="424" width="248" height="88" rx="18" fill="#ffffff" stroke="#dce7fb" stroke-width="1.5" />
    <rect x="58" y="444" width="48" height="48" rx="14" fill="url(#brand-grad)" />
    <path d="M74 468L82 460L90 468M82 460V478" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="120" y="464" fill="#0b1533" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Strategy to Scale</text>
    <text x="120" y="484" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Design · Code · Growth</text>
  </g>
</svg>
