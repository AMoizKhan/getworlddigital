<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" fill="none">
  <defs>
    <linearGradient id="bg-exp" x1="0" y1="0" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8faff" />
      <stop offset="50%" stop-color="#eef4ff" />
      <stop offset="100%" stop-color="#e4eeff" />
    </linearGradient>
    <linearGradient id="brand-exp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b67ff" />
      <stop offset="100%" stop-color="#1a46d4" />
    </linearGradient>
    <filter id="exp-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1533" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="900" height="420" rx="28" fill="url(#bg-exp)" />
  <circle cx="140" cy="80" r="120" fill="#d8e6ff" opacity="0.5" />
