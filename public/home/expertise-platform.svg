    <rect x="88" y="288" width="156" height="18" rx="9" fill="#e6eeff" />
    <text x="166" y="300" text-anchor="middle" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">99.9% Core Web Vitals</text>
