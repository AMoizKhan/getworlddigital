<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" fill="none">
  <defs>
    <linearGradient id="bg-why" x1="0" y1="0" x2="760" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7faff" />
      <stop offset="60%" stop-color="#edf3ff" />
      <stop offset="100%" stop-color="#e3edff" />
    </linearGradient>
    <linearGradient id="blue-pill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b67ff" />
      <stop offset="100%" stop-color="#1a46d4" />
    </linearGradient>
    <filter id="soft-elev" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b1533" flood-opacity="0.08" />
    </filter>
    <filter id="blue-elev" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1f4fe0" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="760" height="560" rx="28" fill="url(#bg-why)" />

  <!-- Ambient Soft Shapes -->
  <circle cx="620" cy="110" r="140" fill="#d7e5ff" opacity="0.55" />
  <circle cx="140" cy="460" r="130" fill="#d7e5ff" opacity="0.45" />
  <path d="M0 390 Q240 330 480 430 T760 360 L760 560 L0 560 Z" fill="#ffffff" opacity="0.45" />

  <!-- Central Strategy Roadmap Board -->
  <g filter="url(#soft-elev)">
    <rect x="86" y="76" width="510" height="390" rx="24" fill="#ffffff" stroke="#dbe6fa" stroke-width="1.5" />

    <!-- Header -->
    <rect x="116" y="106" width="128" height="24" rx="12" fill="#e6eeff" />
    <text x="180" y="122" text-anchor="middle" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">EXECUTION HUB</text>
    <text x="116" y="160" fill="#0b1533" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Outcome-Driven Roadmap</text>

    <!-- Milestone Bars -->
    <!-- Row 1 -->
    <rect x="116" y="186" width="450" height="56" rx="14" fill="#f8faff" stroke="#e7eefc" stroke-width="1" />
    <circle cx="146" cy="214" r="14" fill="#1f4fe0" />
    <path d="M140 214L144 218L152 210" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="174" y="210" fill="#0b1533" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Discovery &amp; Architecture</text>
    <text x="174" y="228" fill="#64748b" font-family="system-ui, sans-serif" font-size="11.5">KPIs, user flows &amp; technical spec</text>
    <rect x="466" y="202" width="80" height="24" rx="12" fill="#e6eeff" />
    <text x="506" y="218" text-anchor="middle" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">100%</text>

    <!-- Row 2 -->
    <rect x="116" y="256" width="450" height="56" rx="14" fill="#f8faff" stroke="#e7eefc" stroke-width="1" />
    <circle cx="146" cy="284" r="14" fill="#1f5bff" />
    <path d="M140 284L144 288L152 280" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="174" y="280" fill="#0b1533" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Design System &amp; Sprints</text>
    <text x="174" y="298" fill="#64748b" font-family="system-ui, sans-serif" font-size="11.5">Weekly demos &amp; shared boards</text>
    <rect x="466" y="272" width="80" height="24" rx="12" fill="#e6eeff" />
    <text x="506" y="288" text-anchor="middle" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Active</text>

    <!-- Row 3 -->
    <rect x="116" y="326" width="450" height="56" rx="14" fill="#f8faff" stroke="#e7eefc" stroke-width="1" />
    <circle cx="146" cy="354" r="14" fill="#e6eeff" />
    <circle cx="146" cy="354" r="5" fill="#1f4fe0" />
    <text x="174" y="350" fill="#0b1533" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Conversion &amp; Scale Optimization</text>
    <text x="174" y="368" fill="#64748b" font-family="system-ui, sans-serif" font-size="11.5">Analytics, speed &amp; continuous ROI</text>
    <rect x="466" y="342" width="80" height="24" rx="12" fill="#eef3ff" />
    <text x="506" y="358" text-anchor="middle" fill="#1f4fe0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Ready</text>

    <!-- Bottom Progress Bar -->
    <rect x="116" y="404" width="450" height="34" rx="12" fill="#f4f7ff" />
    <rect x="128" y="416" width="320" height="10" rx="5" fill="#e1eafe" />
    <rect x="128" y="416" width="268" height="10" rx="5" fill="url(#blue-pill)" />
    <text x="548" y="425" text-anchor="end" fill="#0b1533" font-family="system-ui, sans-serif" font-size="12" font-weight="700">84% Velocity</text>
  </g>

  <!-- Floating Right Metric Card: Conversion Uplift -->
  <g filter="url(#blue-elev)">
    <rect x="498" y="132" width="218" height="132" rx="20" fill="url(#blue-pill)" />
    <text x="522" y="164" fill="#dbe7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AVG. CLIENT IMPACT</text>
    <text x="522" y="206" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="800">+42%</text>
    <text x="522" y="232" fill="#dbe7ff" font-family="system-ui, sans-serif" font-size="12.5">Conversion &amp; Lead Lift</text>
    <!-- Mini Spark Bars -->
    <rect x="652" y="214" width="8" height="24" rx="4" fill="#ffffff" opacity="0.35" />
    <rect x="666" y="200" width="8" height="38" rx="4" fill="#ffffff" opacity="0.6" />
    <rect x="680" y="182" width="8" height="56" rx="4" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Floating Bottom-Right Pill: Zero Surprises -->
  <g filter="url(#soft-elev)">
    <rect x="454" y="418" width="256" height="78" rx="18" fill="#ffffff" stroke="#dbe6fa" stroke-width="1.5" />
    <circle cx="492" cy="457" r="20" fill="#e6eeff" />
    <path d="M484 457L490 463L501 451" stroke="#1f4fe0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="526" y="452" fill="#0b1533" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Dedicated Pod</text>
    <text x="526" y="472" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">One accountable team</text>
  </g>
</svg>
