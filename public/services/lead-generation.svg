<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1668d4" />
      <stop offset="100%" stop-color="#09438f" />
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071a38" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="#ffffff" />

  <!-- Subtle dot accents on pure white -->
  <g fill="#0d57b8" opacity="0.12">
    <circle cx="88" cy="86" r="3" /><circle cx="112" cy="86" r="3" /><circle cx="136" cy="86" r="3" />
    <circle cx="88" cy="110" r="3" /><circle cx="112" cy="110" r="3" /><circle cx="136" cy="110" r="3" />
    <circle cx="88" cy="134" r="3" /><circle cx="112" cy="134" r="3" /><circle cx="136" cy="134" r="3" />
  </g>

  <!-- Main Workflow Dashboard Window -->
  <g filter="url(#sh)">
    <rect x="96" y="76" width="1008" height="598" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <!-- Top Chrome -->
    <path d="M96 102C96 87.64 107.64 76 122 76H1078C1092.36 76 1104 87.64 1104 102V132H96V102Z" fill="#f8faff" />
    <line x1="96" y1="132" x2="1104" y2="132" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="132" cy="104" r="6" fill="#cbd5e1" />
    <circle cx="154" cy="104" r="6" fill="#cbd5e1" />
    <circle cx="176" cy="104" r="6" fill="#cbd5e1" />
    <rect x="440" y="92" width="320" height="24" rx="12" fill="#eef3ff" />
    <text x="600" y="108" text-anchor="middle" fill="#0d57b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">LEAD GEN & FOLLOW-UP</text>

    <!-- Header Row Inside Window -->
    <text x="148" y="196" fill="#071a38" font-family="system-ui, sans-serif" font-size="30" font-weight="800">Automated Pipeline Engine</text>
    <rect x="148" y="216" width="180" height="6" rx="3" fill="url(#brand)" />

    <!-- Right KPI Hero Tile -->
    <rect x="818" y="168" width="234" height="148" rx="22" fill="url(#brand)" />
    <text x="846" y="206" fill="#dbe7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em">LIVE IMPACT</text>
    <text x="846" y="264" fill="#ffffff" font-family="system-ui, sans-serif" font-size="48" font-weight="800">3.5x</text>
    <text x="846" y="294" fill="#dbe7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Booked Meetings</text>

    <!-- Connected 3-Step Automation Pipeline -->
    <!-- Vertical Connector -->
    <line x1="184" y1="296" x2="184" y2="570" stroke="#c8dcff" stroke-width="3" stroke-dasharray="6 6" />

    <!-- Step 1 -->
    <rect x="148" y="266" width="630" height="92" rx="18" fill="#ffffff" stroke="#dbe6ff" stroke-width="1.8" />
    <circle cx="188" cy="312" r="20" fill="#0d57b8" />
    <text x="188" y="317" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">01</text>
    <text x="228" y="307" fill="#071a38" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Multi-Channel Lead Capture</text>
    <text x="228" y="331" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Automated trigger &amp; real-time processing</text>
    <rect x="652" y="296" width="102" height="32" rx="16" fill="#eef3ff" />
    <text x="703" y="316" text-anchor="middle" fill="#0d57b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Active</text>

    <!-- Step 2 -->
    <rect x="148" y="382" width="630" height="92" rx="18" fill="#ffffff" stroke="#dbe6ff" stroke-width="1.8" />
    <circle cx="188" cy="428" r="20" fill="#f57c00" />
    <text x="188" y="433" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">02</text>
    <text x="228" y="423" fill="#071a38" font-family="system-ui, sans-serif" font-size="18" font-weight="700">AI Instant Qualification</text>
    <text x="228" y="447" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Context-aware routing &amp; smart decisions</text>
    <rect x="652" y="412" width="102" height="32" rx="16" fill="#eef3ff" />
    <text x="703" y="432" text-anchor="middle" fill="#0d57b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Synced</text>

    <!-- Step 3 -->
    <rect x="148" y="498" width="630" height="92" rx="18" fill="#ffffff" stroke="#dbe6ff" stroke-width="1.8" />
    <circle cx="188" cy="544" r="20" fill="#071a38" />
    <text x="188" y="549" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">03</text>
    <text x="228" y="539" fill="#071a38" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Auto Follow-Up Sequences</text>
    <text x="228" y="563" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">CRM logging, alerts &amp; performance tracking</text>
    <rect x="652" y="528" width="102" height="32" rx="16" fill="#eef3ff" />
    <text x="703" y="548" text-anchor="middle" fill="#0d57b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Verified</text>

    <!-- Right Bottom Status Card -->
    <rect x="818" y="346" width="234" height="244" rx="22" fill="#f8faff" stroke="#dbe6ff" stroke-width="1.5" />
    <text x="844" y="388" fill="#071a38" font-family="system-ui, sans-serif" font-size="15" font-weight="700">System Health</text>
    <rect x="844" y="414" width="182" height="10" rx="5" fill="#e2ebff" />
    <rect x="844" y="414" width="164" height="10" rx="5" fill="#0d57b8" />
    <text x="844" y="452" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Response Speed · 99.9%</text>
    <rect x="844" y="476" width="182" height="10" rx="5" fill="#e2ebff" />
    <rect x="844" y="476" width="152" height="10" rx="5" fill="#f57c00" />
    <text x="844" y="514" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Accuracy Guardrails · On</text>
    <rect x="844" y="536" width="182" height="32" rx="16" fill="#ffffff" stroke="#dbe6ff" stroke-width="1.5" />
    <circle cx="866" cy="552" r="5" fill="#f57c00" />
    <text x="880" y="556" fill="#071a38" font-family="system-ui, sans-serif" font-size="12" font-weight="700">24/7 Live Ready</text>
  </g>
